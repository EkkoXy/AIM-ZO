[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aim-zo"
version = "0.1.0"
description = "Activation-Informed Subspace Maintenance for Zeroth-Order LLM Fine-Tuning"
readme = "README.md"
authors = [{ name = "AIM-ZO Authors" }]
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch==2.10.0",
    "transformers==4.56.1",
    "accelerate==1.15.0",
    "peft==0.21.0",
    "datasets==5.0.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
    "tensorboard==2.21.0",
    "sentencepiece==0.2.2",
]

[project.urls]
Repository = "https://github.com/EkkoXy/AIM-ZO"
Issues = "https://github.com/EkkoXy/AIM-ZO/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
aimzo-prepare-data = "aimzo.cli.prepare_dataset:main"
aimzo-train = "aimzo.cli.hf_zoregular_train:main"
aimzo-eval = "aimzo.cli.hf_zoregular_eval:main"
aimzo-qa-eval = "aimzo.cli.hf_zoregular_qa_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aimzo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
