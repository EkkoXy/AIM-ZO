schema_version: 1

# This registry is the paper-facing source of truth.  Paths are deliberately
# relative so that generated configs do not expose machine-specific locations.
models:
  opt-2.7b: data/model/OPT-2.7B
  qwen3-4b-base: data/model/Qwen3-4B-Base
  qwen3-0.6b-base: data/model/Qwen3-0.6B-Base
  opt-13b: data/model/OPT-13B

tasks:
  rte: {train: 1000, dev: 500, context: 512, metric: accuracy, mode: max}
  boolq: {train: 1000, dev: 500, context: 512, metric: accuracy, mode: max}
  sst2: {train: 1000, dev: 500, context: 512, metric: accuracy, mode: max}
  wic: {train: 1000, dev: 500, context: 512, metric: accuracy, mode: max}
  wsc: {train: 454, dev: 100, context: 512, metric: accuracy, mode: max}
  multirc: {train: 1000, dev: 500, context: 512, metric: accuracy, mode: max}
  copa: {train: 300, dev: 100, context: 512, metric: accuracy, mode: max}
  cb: {train: 150, dev: 100, context: 512, metric: accuracy, mode: max}
  squad: {train: 1000, dev: 500, context: 1024, metric: loss, mode: min}
  record: {train: 1000, dev: 500, context: 1024, metric: loss, mode: min}
  drop: {train: 1000, dev: 500, context: 1024, metric: loss, mode: min}

# Each group expands to one YAML per task and seed.  calls_per_step is release
# metadata checked against the 40K objective-call budget; the method itself
# determines the number of calls made by the trainer.
protocols:
  - id: opt27-mezo
    scope: primary
    model: opt-2.7b
    method: mezo
    tasks: [rte, boolq, sst2, wic, multirc, record, squad, drop, wsc, copa, cb]
    seeds: [42, 142, 242, 342, 442]
    dtype: bfloat16
    steps: 20000
    calls_per_step: 2
    learning_rate: 5.0e-7
    epsilon: 1.0e-3
    eval_every: 4000
    per_task:
      drop: {learning_rate: 1.0e-7}
      wsc: {learning_rate: 3.0e-7}

  - id: opt27-aimzo
    scope: primary
    model: opt-2.7b
    method: aimzo
    tasks: [rte, boolq, sst2, wic, multirc, record, squad, drop, wsc, copa, cb]
    seeds: [42, 142, 242, 342, 442]
    dtype: bfloat16
    steps: 2500
    calls_per_step: 16
    learning_rate: 1.5e-3
    epsilon: 8.0e-5
    epsilon_schedule: cosine_decay
    epsilon_min_ratio: 0.25
    eval_every: 500
    aimzo_refresh: 10
    per_task:
      wic: {epsilon_min_ratio: 0.5}
      wsc: {learning_rate: 2.0e-3}

  - id: qwen4-mezo
    scope: primary
    model: qwen3-4b-base
    method: mezo
    tasks: [rte, boolq, sst2, wic, multirc, squad]
    seeds: [42, 142, 242, 342, 442]
    dtype: bfloat16
    steps: 20000
    calls_per_step: 2
    learning_rate: 5.0e-7
    epsilon: 1.0e-3
    eval_every: 4000

  - id: qwen4-aimzo
