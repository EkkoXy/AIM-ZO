    learning_rate: 1.0e-3
    epsilon: 8.0e-5
    epsilon_schedule: cosine_decay
    epsilon_min_ratio: 0.25
    eval_every: 500
    aimzo_refresh: 1

  - id: qwen06-mezo
    scope: primary
    model: qwen3-0.6b-base
    method: mezo
    tasks: [rte, sst2, wic, multirc, boolq, squad]
    seeds: [42, 142, 242, 342, 442]
